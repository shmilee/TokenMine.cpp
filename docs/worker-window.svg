        <text x="624" y="598" fill="#bfc0c0" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', system-ui, sans-serif">位级独立 vs 顺序回退</text>

        <!-- Editorial callout -->
        <text x="40" y="632" fill="#949eb2" font-size="14" font-style="italic"
              font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif SC', serif">硬规则 7：worker 只在 post→flush 窗口运行，窗口内主线程只读 World——mesh 2 列/帧（PIPE-1 快照）· light 流送/流体追赶两类各 ≤2（99.10/99.11）</text>
