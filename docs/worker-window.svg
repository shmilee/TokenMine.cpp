        <line x1="280" y1="112" x2="280" y2="548" stroke="#f5f5f5" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="620" y1="112" x2="620" y2="548" stroke="#f5f5f5" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="960" y1="112" x2="960" y2="548" stroke="#f5f5f5" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>

