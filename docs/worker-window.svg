        <!-- Messages -->
        <!-- m1 main → world: update read -->
        <line x1="284" y1="140" x2="956" y2="140" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#worker-window-worker-window-arrow)"/>
        <!-- m2 main → workers: post mesh -->
        <line x1="284" y1="176" x2="616" y2="176" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#worker-window-worker-window-arrow)"/>
        <!-- m3 main → workers: post light ×2 (region 1) -->
        <line x1="284" y1="256" x2="616" y2="256" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#worker-window-worker-window-arrow)"/>
        <!-- m4 main → workers: post light ×1 (region 2) -->
        <line x1="284" y1="316" x2="616" y2="316" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#worker-window-worker-window-arrow)"/>
