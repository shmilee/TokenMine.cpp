        <rect x="276" y="452" width="8" height="84" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="616" y="336" width="8" height="168" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="0.8" fill-opacity="0.06"/>

