        <!-- m8 workers → main: results (return) -->
        <line x1="616" y1="464" x2="284" y2="464" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#worker-window-worker-window-arrow)"/>
        <!-- m9 workers → main: exception rethrow (return) -->
        <line x1="616" y1="496" x2="284" y2="496" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#worker-window-worker-window-arrow)"/>
        <!-- m10 main → world: merge + apply -->
        <line x1="284" y1="528" x2="956" y2="528" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#worker-window-worker-window-arrow)"/>

