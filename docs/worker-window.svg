        <line x1="624" y1="352" x2="956" y2="352" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#worker-window-worker-window-arrow)"/>
        <!-- m6 main self: in-window read-only -->
        <path d="M 284,380 H 336 V 404 H 284" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#worker-window-worker-window-arrow)"/>
