        <rect x="350" y="154" width="200" height="16" rx="2" fill="#2d3142"/>
        <text x="450" y="165" fill="#bfc0c0" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">post mesh（2 列/帧·快照）</text>

        <rect x="358" y="234" width="184" height="16" rx="2" fill="#2d3142"/>
        <text x="450" y="245" fill="#bfc0c0" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">post light ×2（两类各 ≤2）</text>

        <rect x="344" y="296" width="212" height="16" rx="2" fill="#2d3142"/>
        <text x="450" y="307" fill="#bfc0c0" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">post light ×1（顺序回退 = 位级同果）</text>

        <rect x="716" y="330" width="148" height="16" rx="2" fill="#2d3142"/>
        <text x="790" y="341" fill="#bfc0c0" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">执行：读快照（窗口内）</text>

        <rect x="352" y="380" width="208" height="16" rx="2" fill="#2d3142"/>
