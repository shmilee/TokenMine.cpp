<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1160 648" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="worker-window-title worker-window-desc" id="worker-window-root">
        <title id="worker-window-title">TokenMine.cpp worker 窗口</title>
        <desc id="worker-window-desc">post→flush 帧窗口时序：主线程 update 读 World 后投递 mesh job（2 列/帧快照）与 light job（流送/流体追赶各 ≤2，位级独立 gap≥4 否则回退单 job 顺序），窗口内主线程只读 World，flush() 帧同步点后回收结果做列合并 + GL 上传与光照应用。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #worker-window-root { --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', 'Noto Sans SC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #worker-window-root { font-family: var(--font-sans); color: var(--color-ink); }
      #worker-window-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#worker-window-root .diagram-container { overflow-x: visible; }
}
      #worker-window-root { --color-paper:   #2d3142;
