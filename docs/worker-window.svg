      --color-accent:  #f08a59;
      --font-sans:     'Geist', 'Noto Sans SC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #worker-window-root { font-family: var(--font-sans); color: var(--color-ink); }
      #worker-window-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#worker-window-root .diagram-container { overflow-x: visible; }
}</style>
      <style>
      #worker-window-root { --color-paper:   #2d3142;
