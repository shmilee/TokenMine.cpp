        <text x="280" y="102" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">update · render</text>

        <rect x="540" y="64" width="160" height="48" rx="6" fill="#2d3142"/>
        <rect x="540" y="64" width="160" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="620" y="86" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">线程池</text>
        <text x="620" y="102" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">4 workers · post/flush</text>

        <rect x="880" y="64" width="160" height="48" rx="6" fill="#2d3142"/>
