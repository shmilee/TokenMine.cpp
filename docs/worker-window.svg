        <rect x="330" y="472" width="240" height="16" rx="2" fill="#2d3142"/>
        <text x="450" y="483" fill="#bfc0c0" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">异常：首个 exception_ptr 重抛（池不坏）</text>

        <rect x="510" y="504" width="220" height="16" rx="2" fill="#2d3142"/>
        <text x="620" y="515" fill="#bfc0c0" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">列合并 + GL 上传 · 光照应用 markDirty</text>

