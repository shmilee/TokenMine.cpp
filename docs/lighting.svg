        <rect x="752" y="164" width="48" height="12" rx="2" fill="#2d3142"/>
        <text x="776" y="173" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">effSky</text>

        <rect x="96" y="272" width="70" height="16" rx="2" fill="#2d3142"/>
        <text x="131" y="283" fill="#bfc0c0" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">CPU 采样</text>

        <rect x="898" y="380" width="84" height="16" rx="2" fill="#2d3142"/>
        <text x="940" y="391" fill="#bfc0c0" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">override 3 uniform</text>

        <rect x="594" y="288" width="56" height="16" rx="2" fill="#2d3142"/>
        <text x="622" y="299" fill="#bfc0c0" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">门配对</text>

        <rect x="600" y="558" width="72" height="16" rx="2" fill="#2d3142"/>
        <text x="636" y="569" fill="#bfc0c0" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">block 直通</text>

        <!-- Node ① 存储光场 (store) -->
        <rect x="64" y="120" width="224" height="128" rx="6" fill="#2d3142"/>
        <rect x="64" y="120" width="224" height="128" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1" fill-opacity="0.05"/>
        <rect x="72" y="128" width="44" height="12" rx="2" fill="none" stroke="#bfc0c0" stroke-width="0.8" stroke-opacity="0.50"/>
