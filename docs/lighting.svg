#lighting-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="lighting-lighting-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>

        <!-- Arrows (before nodes) -->
        <!-- ① → ② stored -->
        <line x1="288" y1="184" x2="472" y2="184" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#lighting-lighting-arrow)"/>
        <!-- ② → ④ effSky -->
        <line x1="696" y1="184" x2="880" y2="184" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#lighting-lighting-arrow)"/>
        <!-- ① → ③ CPU sample -->
        <path d="M 176,248 V 304 Q 176,312 184,312 H 312 Q 320,312 320,320 V 360"
              fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#lighting-lighting-arrow)"/>
        <!-- ③ → ④ override uniforms -->
        <path d="M 368,488 V 520 Q 368,528 376,528 H 984 Q 992,528 992,520 V 248"
              fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#lighting-lighting-arrow)"/>
        <!-- ② → ⑤ gate pairing -->
        <line x1="584" y1="248" x2="584" y2="360" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#lighting-lighting-arrow)"/>
        <!-- ① → ④ block passthrough -->
        <path d="M 240,248 V 544 Q 240,552 248,552 H 1040 Q 1048,552 1048,544 V 248"
              fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#lighting-lighting-arrow)"/>

