        <text x="176" y="160" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">存储光场</text>
        <text x="176" y="184" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">sky: col-top scan · v0/h1 BFS</text>
        <text x="176" y="200" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">block: emission · omni-1 BFS</text>
        <text x="176" y="216" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">opacity: leaves 2 · glass 1</text>
        <text x="176" y="232" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">water -3 · local 16-shell</text>

        <!-- Node ② 昼夜仿射 (focal) -->
        <rect x="472" y="120" width="224" height="128" rx="6" fill="#2d3142"/>
        <rect x="472" y="120" width="224" height="128" rx="6" fill="#f08a59" stroke="#f08a59" stroke-width="1" fill-opacity="0.08"/>
        <rect x="480" y="128" width="40" height="12" rx="2" fill="none" stroke="#f08a59" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="500" y="137" fill="#f08a59" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">LGT-3</text>
        <text x="584" y="160" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">昼夜仿射</text>
        <text x="584" y="184" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">S = 7 + 8 × dayFactor</text>
        <text x="584" y="200" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">eff = max(stored − (15−S), 0)</text>
        <text x="584" y="216" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">no re-prop · exact per cell</text>
        <text x="584" y="232" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">night floor 7 · confluence</text>

        <!-- Node ④ 着色器消费 (backend) -->
        <rect x="880" y="120" width="224" height="128" rx="6" fill="#2d3142"/>
        <rect x="880" y="120" width="224" height="128" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <rect x="888" y="128" width="52" height="12" rx="2" fill="none" stroke="#f5f5f5" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="914" y="137" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SHADER</text>
        <text x="992" y="160" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">着色器消费</text>
        <text x="992" y="184" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">max(effSky, block)/15 × shade</text>
        <text x="992" y="200" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">top 1.0 / ±X 0.8 / ±Z 0.6</text>
        <text x="992" y="216" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">+ kAmbient 0.03</text>
        <text x="992" y="232" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">fog · ripple inherit</text>

        <!-- Node ③ per-draw override (optional / structurally inert) -->
        <rect x="256" y="360" width="224" height="128" rx="6" fill="#2d3142"/>
        <rect x="256" y="360" width="224" height="128" rx="6" fill="#f5f5f5" stroke="#f5f5f5" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.20"/>
        <rect x="264" y="368" width="44" height="12" rx="2" fill="none" stroke="#f5f5f5" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="286" y="377" fill="#949eb2" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">OVERRIDE</text>
        <text x="368" y="400" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">per-draw 覆盖</text>
        <text x="368" y="424" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">itemDropLight: AABB center</text>
        <text x="368" y="440" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">beamLightSample: beacon beam</text>
        <text x="368" y="456" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">post-draw bind + reset 0</text>
        <text x="368" y="472" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">u_useLightOverride gate</text>

        <!-- Node ⑤ 生成门 (store, small) -->
        <rect x="512" y="360" width="144" height="80" rx="6" fill="#2d3142"/>
        <rect x="512" y="360" width="144" height="80" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1" fill-opacity="0.05"/>
        <rect x="520" y="368" width="44" height="12" rx="2" fill="none" stroke="#bfc0c0" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="542" y="377" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SPAWN</text>
        <text x="584" y="400" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">生成门</text>
        <text x="584" y="420" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">spawn_max_light 7</text>
        <text x="584" y="436" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">night 7 · torch 14</text>

