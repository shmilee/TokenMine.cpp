<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1160 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lighting-title lighting-desc" id="lighting-root">
        <title id="lighting-title">TokenMine.cpp 光照三机制</title>
        <desc id="lighting-desc">光照数据流：双场 0-15 存储光场（BFS 传播 + light_opacity 进入成本 + 局部更新）；LGT-3 昼夜仿射呈现（S = 7 + 8×dayFactor，零重传播，配生成门）；per-draw override（掉落/信标光束 CPU 采样存储场）；着色器最终消费 max(effSky, block)/15 × faceShade。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #lighting-root { --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', 'Noto Sans SC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #lighting-root { font-family: var(--font-sans); color: var(--color-ink); }
      #lighting-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#lighting-root .diagram-container { overflow-x: visible; }
}
      #lighting-root { --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', 'Noto Sans SC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #lighting-root { font-family: var(--font-sans); color: var(--color-ink); }
      #lighting-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#lighting-root .diagram-container { overflow-x: visible; }
}</style>
      <style>
      #lighting-root { --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', 'Noto Sans SC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #lighting-root { font-family: var(--font-sans); color: var(--color-ink); }
      #lighting-root .diagram-container { width: 100%; overflow-x: auto; }
