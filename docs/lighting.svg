        <rect x="392" y="632" width="14" height="10" rx="2" fill="#f5f5f5" stroke="#f5f5f5" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.20"/>
        <text x="414" y="642" fill="#bfc0c0" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', system-ui, sans-serif">per-draw 结构惰性</text>

        <rect x="556" y="632" width="14" height="10" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="578" y="642" fill="#bfc0c0" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', system-ui, sans-serif">着色器消费</text>

        <line x1="700" y1="638" x2="728" y2="638" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#lighting-lighting-arrow)"/>
        <text x="736" y="642" fill="#bfc0c0" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', system-ui, sans-serif">光路径</text>

        <!-- Editorial callout -->
        <text x="40" y="672" fill="#949eb2" font-size="14" font-style="italic"
              font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif SC', serif">三机制都不改存储场：opacity 只改传播成本（LGT-2），昼夜是呈现层无损仿射（LGT-3），override 只碰特定 draw（PRE-6/LGT-4）</text>
      </svg>
