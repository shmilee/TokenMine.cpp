        <text x="40" y="608" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="632" width="14" height="10" rx="2" fill="#f08a59" stroke="#f08a59" stroke-width="1" fill-opacity="0.08"/>
        <text x="62" y="642" fill="#bfc0c0" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', system-ui, sans-serif">LGT-3 呈现映射（焦点）</text>

        <rect x="268" y="632" width="14" height="10" rx="2" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1" fill-opacity="0.05"/>
